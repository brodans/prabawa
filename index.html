<!DOCTYPE html>

    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#020617" />

    <meta name="robots" content="noindex, nofollow" />

    <!--
      ─── Kerangka boot (critical CSS) ─────────────────────────────────
      Ini adalah salinan **persis** dari `StartupShell` + `PageLoading`
      (yang tampil pertama saat reload) di `src/App.tsx`. Ditulis sebagai
      CSS kritis agar langsung terlihat sebelum bundel Tailwind dimuat.

      Salinan ini dijaga huruf-per-huruf:
        • warna skeleton  → `bg-slate-200/70` (light) / `dark:bg-slate-700/60`
        • root            → `bg-slate-50` (light) / `dark:bg-[#0B1120]`
        • sidebar         → `bg-[#0F172A]` / `dark:bg-[#070B14]`
        • sidebar skeleton → `bg-slate-700/60` (sama di kedua tema)
        • header          → `bg-slate-100/80` / `dark:bg-[#0B1120]/80`
        • urutan menu     → grup utama (6), admin (1), referensi (1)

      Jika `StartupShell`/`PageLoading` diubah, salinan ini wajib diubah
      bersama agar tidak ada lompatan tata letak saat React mengambil alih.
      `tools/cek-modal-ringan.mts` memastikan `#root` tetap diawali
      `.boot-shell`.
    -->
    <style>
      /*
       * Preflight Tailwind (`index.css`) baru aktif setelah bundel JS dijalankan
       * — yaitu setelah React mengambil alih. Tanpa baris ini, kerangka boot
       * memakai `content-box` milik peramban, sehingga elemen yang punya ukuran
       * tetap **dan** padding/border (logo sidebar, header, dsb.) melebar keluar
       * kotaknya. Disamakan dengan preflight Tailwind supaya tidak ada lompatan
       * ukuran saat React masuk.
       */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      :root {
        --poni-kiri: env(safe-area-inset-left, 0px);
        --poni-kanan: env(safe-area-inset-right, 0px);
        --poni-atas: env(safe-area-inset-top, 0px);
        --poni-bawah: env(safe-area-inset-bottom, 0px);
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }

      /* ── Root: same as StartupShell ── */
      .boot-shell { position: fixed; inset: 0; z-index: 50; display: none; height: 100dvh; width: 100%; overflow: hidden; background: oklch(0.984 0.003 247.858); color: oklch(0.279 0.041 260.031); }
      html.app-shell-active .boot-shell { display: flex; }
      .dark .boot-shell { background: #0B1120; color: oklch(0.929 0.013 255.508); }

      /* ── Layar login: cocok dengan LoginScreen (bg-slate-200/80 + grid) ── */
      .boot-login { position: fixed; inset: 0; z-index: 40; background-color: #e2e8f0cc; background-color: oklch(0.929 0.013 255.508 / 0.8); }
      .boot-login::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image: linear-gradient(to right, #80808012 1px, transparent 1px), linear-gradient(to bottom, #80808012 1px, transparent 1px);
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 100%);
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 100%);
      }
      .dark .boot-login { background-color: #0a0f1c; }
      .dark .boot-login::before {
        background-image: linear-gradient(to right, #ffffff0a 1px, transparent 1px), linear-gradient(to bottom, #ffffff0a 1px, transparent 1px);
      }
      html.app-shell-active .boot-login { display: none; }

      /* ── Skeleton: same as <Skeleton> (animate-pulse rounded-lg) ── */
      .bsk, .bsk-s, .bsk-n { animation: boot-pulse 2s cubic-bezier(.4,0,.6,1) infinite; border-radius: .5rem; }
      .bsk { background: #e2e8f0b3; background: oklch(0.929 0.013 255.508 / 0.7); }     /* bg-slate-200/70 */
      .dark .bsk { background: #31415899; background: oklch(0.372 0.044 257.287 / 0.6); }   /* dark:bg-slate-700/60 */
      .bsk-s { background: #31415899; background: oklch(0.372 0.044 257.287 / 0.6); }       /* bg-slate-700/60 (sidebar, kedua tema) */
      .bsk-n { background: #fff; }                     /* bg-white … */
      .dark .bsk-n { background: oklch(0.279 0.041 260.031); }            /* … dark:bg-slate-800 */

      /* ── Permukaan kartu ── */
      .bsrf { border: 1px solid #e2e8f0b3; border: 1px solid oklch(0.929 0.013 255.508 / 0.7); border-radius: 1rem; background: #fff; }
      .dark .bsrf { border-color: #31415899; border-color: oklch(0.372 0.044 257.287 / 0.6); background: #1d293d99; background: oklch(0.279 0.041 260.031 / 0.6); }
      .bsrf2 { border: 1px solid oklch(0.929 0.013 255.508); border-radius: 1rem; }
      .dark .bsrf2 { border-color: oklch(0.372 0.044 257.287); }
      .bsrf3 { border: 1px solid #e2e8f0b3; border: 1px solid oklch(0.929 0.013 255.508 / 0.7); border-radius: 1rem; background: #fff; box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); }
      .dark .bsrf3 { border-color: #31415899; border-color: oklch(0.372 0.044 257.287 / 0.6); background: #1d293d99; background: oklch(0.279 0.041 260.031 / 0.6); }

      .b-p4s5 { padding: 1rem; }

      .b-pxy33 { padding: .75rem; }

      /* ── Sidebar (same as StartupShell) ── */
      .boot-sidebar { display: none; height: 100%; width: 16rem; flex: none; flex-direction: column; border-right: 1px solid #1d293d80; border-right: 1px solid oklch(0.279 0.041 260.031 / 0.5); background: #0F172A; }

      @media (min-width: 1024px) { .boot-sidebar { display: flex; } }
      .boot-brand { display: flex; height: 3.5rem; flex: none; align-items: center; gap: .75rem; border-bottom: 1px solid #1d293d99; border-bottom: 1px solid oklch(0.279 0.041 260.031 / 0.6); padding: 0 1.25rem; }
      .boot-logo { height: 2.5rem; width: 2.5rem; flex: none; border-radius: 1rem; background: oklch(0.372 0.044 257.287); padding: .125rem; }

      /* ── Kolom konten + header ── */
      .boot-content { display: flex; min-width: 0; flex: 1 1 0%; flex-direction: column; overflow: hidden; }
      .boot-header { display: flex; height: 3.5rem; flex: none; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0cc; border-bottom: 1px solid oklch(0.929 0.013 255.508 / 0.8); background: #f1f5f9cc; background: oklch(0.968 0.007 247.896 / 0.8); padding-left: max(1rem, var(--poni-kiri)); padding-right: max(1rem, var(--poni-kanan)); }
      .dark .boot-header { border-bottom-color: #1d293dcc; border-bottom-color: oklch(0.279 0.041 260.031 / 0.8); background: #0b1120cc; background: rgb(11 17 32 / 0.8); }
      @media (min-width: 640px) { .boot-header { padding-left: max(1.5rem, var(--poni-kiri)); padding-right: max(1.5rem, var(--poni-kanan)); } }
      .boot-row { display: flex; align-items: center; gap: .75rem; min-width: 0; }
      .boot-hjudul { display: flex; flex-direction: column; gap: .375rem; }
      .b-menu { display: block; }
      @media (min-width: 1024px) { .b-menu { display: none; } }
      .b-clock { display: none; }
      @media (min-width: 640px) { .b-clock { display: block; } }

      /* ── Area isi (poni-konten) ── */
      .boot-main { flex: 1 1 0%; min-height: 0; overflow-y: auto; padding-top: 1.25rem; padding-left: max(1rem, var(--poni-kiri)); padding-right: max(1rem, var(--poni-kanan)); padding-bottom: max(1rem, var(--poni-bawah)); }
      @media (min-width: 640px) { .boot-main { padding-top: 1.5rem; padding-left: max(1.5rem, var(--poni-kiri)); padding-right: max(1.5rem, var(--poni-kanan)); padding-bottom: max(1.5rem, var(--poni-bawah)); } }
      @media (min-width: 1024px) { .boot-main { padding-top: 1.75rem; padding-left: max(2rem, var(--poni-kiri)); padding-right: max(2rem, var(--poni-kanan)); padding-bottom: max(2rem, var(--poni-bawah)); } }

      /* ── Halaman (PageLoading root: w-full space-y-6 / space-y-5) ── */
      .boot-hal { width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
      .boot-hal[data-boot="tabManajemenAkun"], .boot-hal[data-boot="tabPerizinan"] { gap: 1.25rem; }
      [hidden] { display: none !important; }

      /* ── Header halaman (PageLoading.header) ── */
      .boot-ph { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: .75rem; }
      .boot-ph-l { display: flex; min-width: 0; flex: 1 1 0%; align-items: center; gap: .75rem; }
      @media (min-width: 640px) { .boot-ph { flex-direction: row; align-items: center; } }
      .b-h7 { height: 1.75rem; }

      /* ── Stats ── */
      .boot-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; }

      .boot-stat { border: 1px solid #e2e8f0b3; border: 1px solid oklch(0.929 0.013 255.508 / 0.7); border-radius: 1rem; background: #fff; padding: 1rem; box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); }
      .dark .boot-stat { border-color: #31415899; border-color: oklch(0.372 0.044 257.287 / 0.6); background: #1d293d99; background: oklch(0.279 0.041 260.031 / 0.6); }
      .boot-stat-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }

      /* ── Tabel & daftar skeleton ── */
      .bt { display: flex; flex-direction: column; gap: .75rem; }
      .bt-h { display: grid; gap: .75rem; border-bottom: 1px solid oklch(0.929 0.013 255.508); padding: 0 .75rem .75rem; }
      .dark .bt-h { border-color: oklch(0.372 0.044 257.287); }
      .bt-r { display: grid; gap: .75rem; align-items: center; border: 1px solid oklch(0.968 0.007 247.896); border-radius: .75rem; padding: .75rem; }

      .bl { display: flex; flex-direction: column; gap: .625rem; }
      .bl-r { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border: 1px solid oklch(0.929 0.013 255.508); border-radius: .75rem; padding: .75rem .875rem; }
      .dark .bl-r { border-color: oklch(0.372 0.044 257.287); }

      /* ManajemenAkun */

      .b-statstrip { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; overflow: hidden; border: 1px solid #e2e8f0b3; border: 1px solid oklch(0.929 0.013 255.508 / 0.7); border-radius: 1rem; background: #e2e8f0b3; background: oklch(0.929 0.013 255.508 / 0.7); }
      .dark .b-statstrip { border-color: #31415899; border-color: oklch(0.372 0.044 257.287 / 0.6); background: #31415899; background: oklch(0.372 0.044 257.287 / 0.6); }
      @media (min-width: 640px) { .b-statstrip { grid-template-columns: repeat(4, minmax(0,1fr)); } }
      .b-statcell { background: #fff; }
      .dark .b-statcell { background: #1d293d99; background: oklch(0.279 0.041 260.031 / 0.6); }
      .b-filtermk { display: grid; grid-template-columns: repeat(1, minmax(0,1fr)); gap: .625rem; }

      /* Perizinan */

      @media (min-width: 640px) { .b-g2 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
      .b-g2c { display: grid; grid-template-columns: repeat(1, minmax(0,1fr)); gap: .75rem; }

      /* Laporan */

      .b-kaki { margin-top: 1rem; display: flex; flex-direction: column; gap: .75rem; border-top: 1px solid oklch(0.968 0.007 247.896); padding-top: 1rem; }

      .dark .b-weblogin { border-color: oklch(0.372 0.044 257.287); background: oklch(0.208 0.042 265.755); }

  <body>
    <!-- Prevent flash of white before React mounts -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.body.style.background = dark ? '#020617' : '#f1f5f9';
          // Sync theme-color meta dengan tema
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) metaTheme.setAttribute('content', dark ? '#020617' : '#ffffff');
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          /*
           * Meniru `loadSession()` di `src/lib/sessionManager.ts`:
           * pakai penunjuk akun aktif bila sesinya masih sah; kalau tidak,
           * pakai sesi tunggal yang sah. Ini memastikan `.boot-shell` hanya
           * tampil persis ketika aplikasi memang akan menampilkan shell,
           * bukan saat sesi sudah kedaluwarsa/tidak sah (yang justru jatuh
           * ke layar login).
           *
           * Yang **tidak** bisa ditiru di sini: verifikasi tanda tangan
           * token (hanya server yang memegang kuncinya). Itu tetap tugas
           * `AppContext`.
           */
          var PREFIX = 'epresensi_jatim_session_';
          var AKTIF = 'epresensi_jatim_sesi_aktif';
          var VERSI = 2;
          var KEDALUWARSA = 30 * 60 * 1000;
          var sah = function(raw) {
            if (!raw) return false;
            try {
              var s = JSON.parse(raw);
              if (!s || s.version !== VERSI) return false;
              if (typeof s.token !== 'string' || !s.token) return false;
              if (s.token.split('.').length !== 2) return false;
              if (!s.currentUser || s.currentUser.role !== s.boundRole) return false;
              if (!s.currentUser.username) return false;
              if (typeof s.authTime !== 'number' || Date.now() - s.authTime > KEDALUWARSA) return false;
              return true;
            } catch (e) {
              return false;
            }
          };
          var ada = false;
          var aktif = sessionStorage.getItem(AKTIF);
          if (aktif) {
            ada = sah(sessionStorage.getItem(PREFIX + aktif.trim()));
          }
          if (!ada) {
            var jumlah = 0;

      seperti `getPageFromPath()` di `AppContext.tsx`. Dijalankan inline
      (sebelum paint) agar tidak ada kerangka yang salah tampil sekejap.
    -->
    <script>
      (function() {
        try {
          /*
           * Meniru `getPageFromPath()` di `src/context/AppContext.tsx`
           * persis: normalisasi slash akhir → alihkan URL lama (PATH_LAMA)
           * → cocok persis → cocok awalan terpanjang → jatuh ke tabBeranda.
           */
          var PETA = {
            '/beranda': 'tabBeranda',
            '/presensi': 'tabPresensi',
            '/perizinan': 'tabPerizinan',
            '/laporan': 'tabLaporan',
            '/docs': 'tabDocs',
            '/lokasi-absen': 'tabLokasiAbsen',
            '/manajemen-akun': 'tabManajemenAkun',
            '/web': 'tabWeb'
          };
          var LAMA = {
            '/langganan': '/manajemen-akun',
            '/langganan/akun': '/manajemen-akun',
            '/langganan/pembayaran': '/manajemen-akun',
            '/langganan/metode': '/manajemen-akun',
            '/manajemen-akun/langganan': '/manajemen-akun'
          };
          var URUT = Object.keys(PETA).sort(function(a, b) { return b.length - a.length; });

          function dariPath(path) {
            var bersih = (path.length > 1 && path.slice(-1) === '/') ? path.slice(0, -1) : path;
            var lama = LAMA[bersih];
            if (lama) return dariPath(lama);
            if (PETA[bersih]) return PETA[bersih];
            for (var i = 0; i < URUT.length; i++) {
              if (bersih.indexOf(URUT[i] + '/') === 0) return PETA[URUT[i]];
            }
            return 'tabBeranda';
          }

          var id = dariPath(location.pathname);
          var semua = document.querySelectorAll('.boot-hal');
          var ketemu = false;
          for (var j = 0; j < semua.length; j++) {
            var cocok = semua[j].getAttribute('data-boot') === id;
            if (cocok) ketemu = true;
            semua[j].hidden = !cocok;
          }
          if (!ketemu) {
            var fb = document.querySelector('.boot-hal[data-boot="lain"]');
            if (fb) fb.hidden = false;
          }
        } catch (e) {
          var fallback = document.querySelector('.boot-hal[data-boot="tabBeranda"]');
          if (fallback) fallback.hidden = false;
        }
      })();
    </script>
