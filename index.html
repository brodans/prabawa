<!DOCTYPE html>
<html lang="id" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PRABAWA - Portal Presensi Jawa Timur</title>

    <!-- ─── Favicon ──────────────────────────────────────────────
         Hanya file yang benar-benar ada di public/assets/. Sebelumnya
         menunjuk favicon-16x16.png / favicon-32x32.png yang tidak ada,
         sehingga ikon tidak pernah termuat. -->
    <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

    <!-- ─── PWA Manifest ────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ─── Theme color (diupdate oleh JS saat toggle dark mode) ── -->
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />

    <!-- ─── iOS / Apple PWA ─────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PRABAWA" />

    <!-- ─── Android / General PWA ───────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PRABAWA" />
    <meta name="application-version" content="1.0.0" />

    <!-- ─── SEO / Social ────────────────────────────────────── -->
    <meta name="description" content="Portal Presensi Jawa Timur — panel web untuk absensi, perizinan, dan laporan." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ─── Google Fonts ────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      .boot-shell { display: flex; width: 100%; height: 100dvh; overflow: hidden; background: #f1f5f9; }
      .boot-sidebar { display: none; width: 16rem; flex: none; padding: 1.25rem; background: #0f172a; }
      .boot-brand { display: flex; height: 2.5rem; align-items: center; gap: .75rem; }
      .boot-brand img { width: 2.5rem; height: 2.5rem; object-fit: contain; }
      .boot-nav { display: grid; gap: 1.5rem; margin-top: 2rem; }
      .boot-group { display: grid; gap: .75rem; }
      .boot-line { height: .75rem; border-radius: .5rem; background: #cbd5e1; }
      .boot-sidebar .boot-line { background: #334155; }
      .boot-content { display: flex; min-width: 0; flex: 1; flex-direction: column; }
      .boot-header { display: flex; height: 3.5rem; flex: none; align-items: center; justify-content: space-between; padding: 0 1.5rem; border-bottom: 1px solid #e2e8f0; }
      .boot-main { display: grid; flex: 1; align-content: start; gap: 1rem; padding: 2rem; }
      .boot-card { height: 7rem; border: 1px solid #e2e8f0; border-radius: .75rem; background: #fff; }
      .boot-row { display: flex; align-items: center; gap: .75rem; }
      .boot-circle { width: 2.25rem; height: 2.25rem; border-radius: 50%; }
      @media (min-width: 1024px) { .boot-sidebar { display: block; } }
      .dark .boot-shell { background: #0b1120; }
      .dark .boot-header { border-color: #1e293b; background: #0b1120; }
      .dark .boot-line { background: #334155; }
      .dark .boot-card { border-color: #334155; background: #1e293b; }
      @media (max-width: 639px) { .boot-main { padding: 1rem; } }
    </style>
  </head>
  <body>
    <!-- Prevent flash of white before React mounts -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.body.style.background = dark ? '#020617' : '#f1f5f9';
          // Sync theme-color meta dengan tema
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) metaTheme.setAttribute('content', dark ? '#020617' : '#ffffff');
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var username = sessionStorage.getItem('epresensi_jatim_sesi_aktif');
          if (username && sessionStorage.getItem('epresensi_jatim_session_' + username)) {
            document.documentElement.classList.add('app-shell-active');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <aside class="boot-sidebar">
          <div class="boot-brand"><img src="/assets/icon-192.png" alt="" /><div class="boot-line" style="width: 7rem"></div></div>
          <div class="boot-nav">
            <div class="boot-group"><div class="boot-line" style="width: 5rem"></div><div class="boot-line"></div><div class="boot-line"></div><div class="boot-line"></div></div>
            <div class="boot-group"><div class="boot-line" style="width: 5rem"></div><div class="boot-line"></div></div>
          </div>
        </aside>
        <div class="boot-content">
          <header class="boot-header"><div class="boot-row"><div class="boot-line" style="width: 7rem"></div><div class="boot-line" style="width: 10rem"></div></div><div class="boot-circle boot-line"></div></header>
          <main class="boot-main"><div class="boot-row"><div class="boot-circle boot-line"></div><div class="boot-group"><div class="boot-line" style="width: 11rem"></div><div class="boot-line" style="width: 16rem"></div></div></div><div class="boot-card"></div><div class="boot-card"></div></main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
